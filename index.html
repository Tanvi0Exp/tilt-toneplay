        // Accent colour choices, all bright / neon. The first one is the default.
        const PALETTE = [
          { name: 'Pink',   c: '#F71B90' },
          { name: 'Yellow', c: '#E8FF00' },
          { name: 'Green',  c: '#2BFF4F' },
          { name: 'Blue',   c: '#12B5FF' },
          { name: 'Red',    c: '#FF2B3A' }
        ];

        const COLORS = { frame: '#000000', bg: '#080808', dark: '#181818', pink: PALETTE[0].c };  // "pink" is the live accent colour
        const FLIP_MS = 190;          // flip duration
        const PERSPECTIVE = 2.5;      // flip depth, in tile sizes (lower = stronger 3D look)
        const LIFE_MS = 800;          // how long a slid tile stays lit while its note dies away

        // Frame: sides are a little thicker than a tile, the top holds the logo, the bottom holds the controls.
        const SIDE_FRAC = 1.25;       // x tile size
        const TOP_FRAC = 2.6;         // x tile size
        const BOTTOM_FRAC = 3.2;      // x tile size

        // Pitch map: A minor pentatonic, A2 (110 Hz) up about four octaves.
        const SCALE = [0, 3, 5, 7, 10];
        const BASE_FREQ = 110;
        const COL_STEPS = 15;
        const ROW_STEPS = 5;
        const MAX_NOTE = COL_STEPS + ROW_STEPS;

        const canvas = document.getElementById('board');
        const g = canvas.getContext('2d', { alpha: false });

        /* =====================================================================
           AUDIO

           ===================================================================== */
        const AudioEngine = (() => {
          let ac = null, master = null, comp = null, loopBus = null;
          let capSend = () => {}, capReadyP = null, capChunks = [], capOn = false, capResolve = null;
          const voices = new Map();   // note -> voice
          const counts = new Map();   // note -> number of persistent tiles on that pitch

          const freqOf = n => BASE_FREQ * Math.pow(2, (12 * Math.floor(n / 5) + SCALE[n % 5]) / 12);
          const levelOf = (n, count) => 0.5 * (1 - 0.45 * n / MAX_NOTE) * (1 + 0.4 * (1 - 1 / count));

          function init() {
            if (!ac) {
              const AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) return;
              ac = new AC({ latencyHint: 'interactive' });

              master = ac.createGain();
              master.gain.value = 0.9;
              comp = ac.createDynamicsCompressor();
              comp.threshold.value = -20; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
              master.connect(comp); comp.connect(ac.destination);

              const len = Math.floor(ac.sampleRate * 2.4);
              const ir = ac.createBuffer(2, len, ac.sampleRate);
              for (let ch = 0; ch < 2; ch++) {
                const d = ir.getChannelData(ch);
                for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
              }
              const conv = ac.createConvolver(); conv.buffer = ir;
              const send = ac.createGain(); send.gain.value = 0.28;

              lc.threshold.value = -14; lc.ratio.value = 6;

            v.lp.frequency.setValueAtTime(3800, now);
            v.lp.frequency.setTargetAtTime(1500, now + 0.01, 0.14);

                p.setTargetAtTime(lvl, now + 0.05, 0.09);

            let peak = 0;
            for (let i = 0; i < l.length; i++) peak = Math.max(peak, Math.abs(l[i]), Math.abs(r[i]));
            if (l.length < ac.sampleRate * 0.15 || peak < 0.002) return null;
            const f = Math.min(240, l.length >> 1);          // ~5 ms edge fades to avoid a click at the loop seam
            for (let i = 0; i < f; i++) {
              const k = i / f;
              l[i] *= k; r[i] *= k; l[l.length - 1 - i] *= k; r[r.length - 1 - i] *= k;
            }
            const buf = ac.createBuffer(2, l.length, ac.sampleRate);
            buf.copyToChannel(l, 0); buf.copyToChannel(r, 1);
            return { buf, src: null, gain: null, dur: buf.duration, t0: 0 };   // not playing yet: see playLoop
          }

          // Starts (or restarts from the beginning) a loop on its own source.
          function playLoop(loop) {
            stopLoop(loop);
            const src = ac.createBufferSource(); src.buffer = loop.buf; src.loop = true;
            const gn = ac.createGain();
            src.connect(gn); gn.connect(loopBus);
            src.start();
            loop.src = src; loop.gain = gn; loop.t0 = ac.currentTime;
          }

          // Stops a loop with a very short fade; its buffer is kept so it can be played again.
          function stopLoop(loop) {
            const src = loop.src, gn = loop.gain;
            if (!src) return;
            loop.src = null; loop.gain = null;
            const t = ac.currentTime;
            gn.gain.cancelScheduledValues(t);
            gn.gain.setValueAtTime(gn.gain.value, t);
            gn.gain.setTargetAtTime(0, t, 0.01);
            try { src.stop(t + 0.08); } catch (_) {}
            setTimeout(() => { src.disconnect(); gn.disconnect(); }, 200);
          }

          return { init, sustain, pluck, resync, available, captureReady, now, startCapture, stopCapture, makeLoop, playLoop, stopLoop };
        })();

        /* =====================================================================
           GRID STATE
           kind: 0 = black, 1 = tapped (stays until tapped again), 2 = slid (fades out)
           ===================================================================== */
        let dpr = 1, W = 0, H = 0;
        let cols = 0, rows = 0, cell = 0, tile = 0, gap = 1, ox = 0, oy = 0, gridW = 0, gridH = 0;
        const btn = { x: 0, y: 0, r: 0 };                 // reset button (centre)
        const cbtn = { x: 0, y: 0, r: 0 };                // colour button (right)
        const rec = { x: 0, y: 0, r: 0, digit: 12, state: 'idle', count: 0, timers: [], maxTimer: 0, t0: 0 };  // recorder button (left)
        const bar = { w: 0, h: 0, gap: 0 };
        let swatches = [];                  // colour choices shown when the colour button is open
        let paletteOpen = false;
        let slots = [];                     // positions of loop bars in the bottom frame
        const loops = [];                   // { src, dur, t0 }, one per bar
        let pos = new Float32Array(0);      // flip progress per tile, 0 = black, 1 = lit
        let target = new Uint8Array(0);     // desired visual state per tile
        let kind = new Uint8Array(0);
        let noteMap = new Uint8Array(0);    // pitch per tile
        const pink = new Set();             // r * 65536 + c of tapped tiles, kept across resizes
        const animating = new Set();
        const transients = new Map();       // slid tile index -> time it flips back

        const keyOf = i => ((i / cols) | 0) * 65536 + (i % cols);

        /* =====================================================================
           LOGO
           ===================================================================== */
        const logo = new Image();
        const logoTint = document.createElement('canvas');   // the logo painted in the current accent colour
        let logoOK = false;
        function tintLogo() {
          if (!logoOK) return;
          logoTint.width = logo.naturalWidth; logoTint.height = logo.naturalHeight;
          const t = logoTint.getContext('2d');
          t.drawImage(logo, 0, 0);
          t.globalCompositeOperation = 'source-in';       // keep the logo's shape, replace its colour
          t.fillStyle = COLORS.pink;
          t.fillRect(0, 0, logoTint.width, logoTint.height);
        }
        if (LOGO_SRC) {
          logo.onload = () => { logoOK = true; tintLogo(); kick(); };
          logo.src = LOGO_SRC;
        }

        /* =====================================================================
           LAYOUT: whole device pixels only, so every gap is exactly the same width
           ===================================================================== */
        function computeLayout() {
          dpr = window.devicePixelRatio || 1;
          const cssW = canvas.clientWidth, cssH = canvas.clientHeight;
          const w = Math.round(cssW * dpr), h = Math.round(cssH * dpr);
          const gp = Math.max(1, Math.round(dpr));
          const tCss = cssW >= 2400 ? 20 : cssW >= 1600 ? 18 : 17;
          const want = tCss * dpr;
          const side = Math.round(want * SIDE_FRAC), top = Math.round(want * TOP_FRAC), bottom = Math.round(want * BOTTOM_FRAC);
          const iw = Math.max(cell || 50, w - 2 * side), ih = Math.max(50, h - top - bottom);

          let best = null;
          for (let c = Math.round((tCss - 2) * dpr); c <= Math.round((tCss + 2) * dpr); c++) {
            if (c <= gp + 1) continue;
            const nc = Math.max(1, Math.floor((iw + gp) / c)), nr = Math.max(1, Math.floor((ih + gp) / c));
            const score = (iw + gp - nc * c) + (ih + gp - nr * c) + 0.01 * Math.abs(c - want);
            if (!best || score < best.score) best = { c, nc, nr, score };
          }
          return { w, h, gp, side, top, bottom, cell: best.c, cols: best.nc, rows: best.nr };
        }

        function applyLayout(L) {
          W = L.w; H = L.h; gap = L.gp; cell = L.cell; cols = L.cols; rows = L.rows;
          tile = cell - gap;
          gridW = cols * cell - gap; gridH = rows * cell - gap;
          ox = Math.floor((W - gridW) / 2);
          const extraV = Math.max(0, H - gridH - L.top - L.bottom);
          oy = L.top + Math.floor(extraV / 2);
          const thickness = H - (oy + gridH);
          btn.r = Math.round(thickness * 0.26);
          btn.x = W / 2; btn.y = oy + gridH + thickness / 2;

          rec.r = btn.r; rec.x = ox + rec.r * 1.8; rec.y = btn.y;
          cbtn.r = btn.r; cbtn.x = ox + gridW - cbtn.r * 1.8; cbtn.y = btn.y;

          bar.w = Math.max(3, Math.round(cell * 0.5)); bar.h = Math.round(thickness * 0.55);
          bar.gap = Math.round(cell * 0.5);
          rec.fs = Math.max(9, Math.round(rec.r * 0.8));
          g.font = `700 ${rec.fs}px system-ui, sans-serif`;
          rec.labelW = Math.ceil(Math.max(g.measureText('REC').width, g.measureText('0:00').width));
          const by = Math.round(btn.y - bar.h / 2);
          slots = [];
          const x1 = Math.round(btn.x - btn.r - bar.gap * 3);
          for (let x = Math.round(rec.x + rec.r + rec.r * 0.6 + rec.labelW + bar.gap * 1.5); x + bar.w <= x1; x += bar.w + bar.gap) slots.push({ x, y: by });

          // colour choices: a row between the reset button and the colour button
          const n = PALETTE.length;
          const availL = btn.x + btn.r + btn.r * 0.6, availR = cbtn.x - cbtn.r - btn.r * 0.6;
          const avail = Math.max(10, availR - availL);
          const sr = Math.max(4, Math.min(btn.r * 0.8, avail / (n * 2.5)));
          const step = Math.min(sr * 2.8, avail / n);
          swatches = PALETTE.map((p, i) => ({ x: availR - step * (n - i - 0.5), y: btn.y, r: sr, color: p.c }));

          canvas.width = W; canvas.height = H;

          const cnt = cols * rows;
          pos = new Float32Array(cnt); target = new Uint8Array(cnt); kind = new Uint8Array(cnt); noteMap = new Uint8Array(cnt);
          animating.clear(); transients.clear();

          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const cs = cols > 1 ? Math.round(c / (cols - 1) * COL_STEPS) : 0;
              const rs = rows > 1 ? Math.round((rows - 1 - r) / (rows - 1) * ROW_STEPS) : 0;
              noteMap[r * cols + c] = cs + rs;
            }
          }
          const counts = new Map();
          pink.forEach(key => {
            const r = Math.floor(key / 65536), c = key % 65536;
            if (r < rows && c < cols) {
              const i = r * cols + c;
              target[i] = 1; pos[i] = 1; kind[i] = 1;
              counts.set(noteMap[i], (counts.get(noteMap[i]) || 0) + 1);
            }
          });
          redrawAll();
          AudioEngine.resync(counts);
        }

        /* =====================================================================
           DRAWING
           ===================================================================== */
        function redrawAll() {
          g.fillStyle = COLORS.frame; g.fillRect(0, 0, W, H);
          g.fillStyle = COLORS.bg; g.fillRect(ox, oy, gridW, gridH);
          for (let i = 0; i < target.length; i++) drawStatic(i);
          drawUI();
        }

        function setAccent(color) {
          COLORS.pink = color;
          tintLogo();
          redrawAll();
        }

        function drawStatic(i) {
          const x = ox + (i % cols) * cell, y = oy + ((i / cols) | 0) * cell;
          g.fillStyle = target[i] ? COLORS.pink : COLORS.dark;
          g.fillRect(x, y, tile, tile);
        }

        // Vertical flip: the tile turns around its horizontal axis, and the far edge shrinks.
        function drawFlip(i, p) {
          const x = ox + (i % cols) * cell, y = oy + ((i / cols) | 0) * cell;
          g.fillStyle = COLORS.bg; g.fillRect(x, y, tile, tile);

          const th = (1 - (1 - p) * (1 - p)) * Math.PI;       // ease-out: starts fast, so it reacts at once
          const cs = Math.cos(th), sn = Math.sin(th);
          const half = tile / 2, cx = x + half, cy = y + half;
          const s = half * sn, D = tile * PERSPECTIVE;
          const wFar = half * (D - s) / (D + s);
          const yt = cy - half * cs, yb = cy + half * cs;

          g.fillStyle = th < Math.PI / 2 ? COLORS.dark : COLORS.pink;
          g.beginPath();
          g.moveTo(cx - wFar, yt); g.lineTo(cx + wFar, yt);
          g.lineTo(cx + half, yb); g.lineTo(cx - half, yb);
          g.closePath(); g.fill();
        }

        const fmtTime = ms => {
          const s = Math.floor(ms / 1000);
          return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
        };

        // Top frame: logo on the left, a clear "recording" notice on the right while recording.
        function drawTop() {
          g.fillStyle = COLORS.frame; g.fillRect(0, 0, W, oy);

          if (logoOK) {
            const hgt = Math.round(oy * 0.76), w = Math.round(hgt * logo.naturalWidth / logo.naturalHeight);
            g.drawImage(logoTint, ox, Math.round((oy - hgt) / 2), w, hgt);
          } else {
            g.save();
            g.fillStyle = COLORS.pink; g.textAlign = 'left'; g.textBaseline = 'middle';
            g.font = `800 ${Math.round(oy * 0.34)}px system-ui, sans-serif`;
            g.fillText('TILT & TONE', ox, oy / 2);
            g.restore();
          }

        }

        // Circular "reset" arrow, drawn in the frame colour on top of the accent disc.
        function drawResetIcon(x, y, r) {
          const ir = r * 0.5;
          g.save();
          g.strokeStyle = COLORS.frame; g.fillStyle = COLORS.frame;
          g.lineWidth = Math.max(2, r * 0.17); g.lineCap = 'round';
          const a0 = -Math.PI * 20 / 180, a1 = -Math.PI * 80 / 180;
          g.beginPath(); g.arc(x, y, ir, a0, a1 + Math.PI * 2); g.stroke();
          const px = x + ir * Math.cos(a1), py = y + ir * Math.sin(a1);
          const tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);
          const hl = r * 0.4, hw = r * 0.3;
          g.beginPath();
          g.moveTo(px + tx * hl, py + ty * hl);
          g.lineTo(px + nx * hw, py + ny * hw);
          g.lineTo(px - nx * hw, py - ny * hw);
          g.closePath(); g.fill();
          g.restore();
        }

        // Bottom frame: recorder (left), loop bars, reset button (centre), colour picker (right). Repainted as a whole.
        function drawUI() {
          drawTop();
          const top = oy + gridH, TAU = Math.PI * 2, now = performance.now();
          g.fillStyle = COLORS.frame; g.fillRect(0, top, W, H - top);

          // reset button
          g.fillStyle = COLORS.pink;
          g.beginPath(); g.arc(btn.x, btn.y, btn.r, 0, TAU); g.fill();
          drawResetIcon(btn.x, btn.y, btn.r);

          // recorder: ring + dot with "REC" beside it. While recording the dot blinks and "REC" becomes the timer.
          const { x, y, r } = rec, lw = Math.max(1.5, dpr * 2);
          g.save();
          g.strokeStyle = COLORS.pink; g.fillStyle = COLORS.pink; g.lineWidth = lw;
          if (rec.state === 'stopping') g.globalAlpha = 0.45;
          g.beginPath(); g.arc(x, y, r - lw / 2, 0, TAU); g.stroke();
          if (rec.state === 'countdown') {
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.font = `600 ${Math.round(r * 1.15)}px system-ui, sans-serif`;
            g.fillText(String(rec.count), x, y + r * 0.05);
            const prog = Math.min(1, (now - rec.cdStart) / 3000);
            g.lineWidth = lw * 1.6;
            g.beginPath(); g.arc(x, y, r + lw * 2.2, -Math.PI / 2, -Math.PI / 2 + prog * TAU); g.stroke();
          } else {
            if (rec.state === 'recording') g.globalAlpha = Math.sin(now / 220) > 0 ? 1 : 0.2;   // blinking dot
            g.beginPath(); g.arc(x, y, r * 0.5, 0, TAU); g.fill();
          }
          g.restore();

          g.save();
          g.fillStyle = COLORS.pink; g.textAlign = 'left'; g.textBaseline = 'middle';
          if (rec.state === 'stopping') g.globalAlpha = 0.45;
          g.font = `700 ${rec.fs}px system-ui, sans-serif`;
          g.fillText(rec.state === 'recording' ? fmtTime(now - rec.t0) : 'REC', x + r + r * 0.6, y + dpr * 0.5);
          g.restore();

          // loop bars: one slim solid bar per loop, in the order they were recorded
          g.fillStyle = COLORS.pink;
          g.globalAlpha = (rec.state === 'recording' || rec.state === 'stopping') ? 0.35 : 1;   // dimmed while paused
          for (let i = 0; i < loops.length && i < slots.length; i++) g.fillRect(slots[i].x, slots[i].y, bar.w, bar.h);
          g.globalAlpha = 1;

          // colour button: a wheel of all the choices with the active colour in the middle
          const n = PALETTE.length;
          for (let i = 0; i < n; i++) {
            g.fillStyle = PALETTE[i].c;
            g.beginPath(); g.moveTo(cbtn.x, cbtn.y);
            g.arc(cbtn.x, cbtn.y, cbtn.r, -Math.PI / 2 + i * TAU / n, -Math.PI / 2 + (i + 1) * TAU / n);
            g.closePath(); g.fill();
          }
          g.fillStyle = COLORS.frame;
          g.beginPath(); g.arc(cbtn.x, cbtn.y, cbtn.r * 0.5, 0, TAU); g.fill();
          g.fillStyle = COLORS.pink;
          g.beginPath(); g.arc(cbtn.x, cbtn.y, cbtn.r * 0.34, 0, TAU); g.fill();

          // open colour list
          if (paletteOpen) {
            for (const s of swatches) {
              g.fillStyle = s.color;
              g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.fill();
              if (s.color === COLORS.pink) {
                g.strokeStyle = '#ffffff'; g.lineWidth = Math.max(1.5, dpr * 1.5);
                g.beginPath(); g.arc(s.x, s.y, s.r + Math.max(2, dpr * 2.5), 0, TAU); g.stroke();
              }
            }
          }
        }

        const uiActive = () => rec.state !== 'idle' || loops.length > 0;

        let rafId = 0, lastT = 0;
        function frame(now) {
          rafId = 0;
          const dt = Math.min(50, Math.max(4, now - lastT)); lastT = now;

          // Slid tiles flip back once their note has died away.
          if (transients.size) {
            const t = performance.now();
            for (const [i, exp] of transients) {
              if (t >= exp) { transients.delete(i); kind[i] = 0; target[i] = 0; animating.add(i); }
            }
          }

          const step = dt / FLIP_MS;
          for (const i of animating) {
            let p = pos[i]; const t = target[i];
            p = p < t ? Math.min(t, p + step) : Math.max(t, p - step);
            pos[i] = p;
            if (p === t) { animating.delete(i); drawStatic(i); } else drawFlip(i, p);
          }
          drawUI();
          if ((animating.size || transients.size || uiActive()) && !rafId) rafId = requestAnimationFrame(frame);
        }
        function kick() {
          if (!rafId) { lastT = performance.now() - 8; rafId = requestAnimationFrame(frame); }
        }

        /* =====================================================================
           TILE ACTIONS
           ===================================================================== */
        function setVisual(i, on) {
          if (target[i] === on) return;
          target[i] = on; animating.add(i); kick();
        }

        function makeTapped(i) {            // black or fading tile -> stays lit with a held note
          kind[i] = 1; transients.delete(i); pink.add(keyOf(i));
          setVisual(i, 1);
          AudioEngine.sustain(noteMap[i], 1);
        }

        function clearTapped(i) {           // tapped tile -> black, note released
          kind[i] = 0; pink.delete(keyOf(i));
          setVisual(i, 0);
          AudioEngine.sustain(noteMap[i], -1);
        }

        function demoteToSlid(i) {          // a tap that turned into a slide: let it fade instead of stay
          pink.delete(keyOf(i));
          AudioEngine.sustain(noteMap[i], -1);
          kind[i] = 2; transients.set(i, performance.now() + LIFE_MS); kick();
        }

        function playSlid(i) {              // a tile crossed during a slide
          if (kind[i] === 1) return;        // tapped tiles are left alone
          kind[i] = 2;
          transients.set(i, performance.now() + LIFE_MS);
          setVisual(i, 1);
          AudioEngine.pluck(noteMap[i]);
          kick();
        }

        function resetAll() {
          for (let i = 0; i < target.length; i++) {
            if (target[i]) { target[i] = 0; animating.add(i); }
            kind[i] = 0;
          }
          pink.clear(); transients.clear();
          AudioEngine.resync(new Map());
          loops.splice(0).forEach(l => AudioEngine.stopLoop(l));      // reset clears the loops too
          lastBarTap = { loop: null, t: 0 };
          if (rec.state === 'countdown') cancelCountdown();
          else if (rec.state === 'recording' || rec.state === 'stopping') {
            rec.discard = true;                                       // an in-progress take is dropped
            if (rec.state === 'recording') stopRecording();
          }
          kick();
        }

        /* =====================================================================
           RECORDING AND LOOPS
           idle -> countdown (3,2,1; nothing captured) -> recording -> stopping -> idle
           ===================================================================== */
        const MAX_REC_MS = 60000;

        function pressRecorder() {
          if (rec.state === 'countdown') { cancelCountdown(); return; }
          if (rec.state === 'recording') { stopRecording(); return; }
          if (rec.state !== 'idle' || loops.length >= slots.length) return;
          AudioEngine.init();                         // needs a user gesture
          if (!AudioEngine.available()) return;
          rec.state = 'countdown'; rec.count = 3; rec.cdStart = performance.now(); kick();
          rec.timers = [
            setTimeout(() => { rec.count = 2; }, 1000),
            setTimeout(() => { rec.count = 1; }, 2000),
            setTimeout(beginRecording, 3000)
          ];
        }

        function cancelCountdown() {
          rec.timers.forEach(clearTimeout); rec.timers = [];
          rec.state = 'idle'; kick();
        }

        async function beginRecording() {
          await AudioEngine.captureReady();
          if (rec.state !== 'countdown') return;
          loops.forEach(l => AudioEngine.stopLoop(l));   // silence existing loops so only the new take is heard and recorded
          AudioEngine.startCapture();
          rec.state = 'recording';
          rec.t0 = performance.now();
          rec.maxTimer = setTimeout(stopRecording, MAX_REC_MS);
        }

        async function stopRecording() {
          if (rec.state !== 'recording') return;
          rec.state = 'stopping'; clearTimeout(rec.maxTimer);
          const data = await AudioEngine.stopCapture();
          const loop = AudioEngine.makeLoop(data);    // null if nothing audible was played
          if (loop && !rec.discard) loops.push(loop); else if (loop) AudioEngine.stopLoop(loop);
          rec.discard = false;
          loops.forEach(l => AudioEngine.playLoop(l));   // every loop restarts together, in sync
          rec.state = 'idle'; kick();
        }

        function deleteLoop(loop) {
          const i = loops.indexOf(loop);
          if (i < 0) return;
          AudioEngine.stopLoop(loop);
          loops.splice(i, 1);
          kick();
        }

        /* =====================================================================
           POINTER INPUT (multi-touch)
           Every pointer has its own state, keyed by pointerId, so any number of
           fingers can press, slide and lift independently.
           Pressing a tile toggles it and it stays. If that pointer then moves on
           to another tile it is a slide: slid tiles play, then fade out.
           ===================================================================== */
        const pointers = new Map();   // pointerId -> { touched, lastX, lastY, pendingIdx }
        let lastBarTap = { loop: null, t: 0 };

        function indexAt(clientX, clientY) {
          const c = Math.floor((clientX * dpr - ox) / cell);
          const r = Math.floor((clientY * dpr - oy) / cell);
          return (c < 0 || r < 0 || c >= cols || r >= rows) ? -1 : r * cols + c;
        }

        function overCircle(o, clientX, clientY, extra) {
          const dx = clientX * dpr - o.x, dy = clientY * dpr - o.y, r = o.r + (extra === undefined ? 6 : extra) * dpr;
          return dx * dx + dy * dy <= r * r;
        }

        function swatchAt(clientX, clientY) {
          if (!paletteOpen) return -1;
          for (let i = 0; i < swatches.length; i++) if (overCircle(swatches[i], clientX, clientY, 5)) return i;
          return -1;
        }

        function barAt(clientX, clientY) {
          const px = clientX * dpr, py = clientY * dpr, pad = Math.max(2 * dpr, bar.gap / 2);
          for (let i = 0; i < loops.length && i < slots.length; i++) {
            const s = slots[i];
            if (px >= s.x - pad && px <= s.x + bar.w + pad && py >= s.y - pad && py <= s.y + bar.h + pad) return i;
          }
          return -1;
        }

        // Controls in the bottom frame. Returns true when the press belongs to a control, not a tile.
        function pressControls(e) {
          const sw = swatchAt(e.clientX, e.clientY);
          if (sw >= 0) { setAccent(swatches[sw].color); paletteOpen = false; kick(); return true; }
          if (overCircle(cbtn, e.clientX, e.clientY)) { paletteOpen = !paletteOpen; kick(); return true; }
          if (overCircle(btn, e.clientX, e.clientY)) { resetAll(); return true; }
          if (overCircle(rec, e.clientX, e.clientY)) { pressRecorder(); return true; }
          const b = barAt(e.clientX, e.clientY);
          if (b >= 0) {
            const loop = loops[b], t = performance.now();
            if (lastBarTap.loop === loop && t - lastBarTap.t < 350) { deleteLoop(loop); lastBarTap = { loop: null, t: 0 }; }
            else lastBarTap = { loop, t };
            return true;
          }
          return false;
        }

        function touchAt(st, x, y) {
          const i = indexAt(x, y);
          if (i < 0 || st.touched.has(i)) return;
          st.touched.add(i);
          if (st.pendingIdx >= 0) { demoteToSlid(st.pendingIdx); st.pendingIdx = -1; }
          playSlid(i);
        }

        function touchAlong(st, x0, y0, x1, y1) {
          const dx = x1 - x0, dy = y1 - y0;
          const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (cell / dpr * 0.4)));
          for (let s = 1; s <= steps; s++) touchAt(st, x0 + dx * s / steps, y0 + dy * s / steps);
        }

        function startGesture(e) {
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          e.preventDefault();
          if (pointers.has(e.pointerId) || pressControls(e)) return;

          if (paletteOpen) { paletteOpen = false; kick(); }   // touching the grid closes the colour list

          AudioEngine.init();                       // browsers only allow audio after a user gesture
          const st = { touched: new Set(), lastX: e.clientX, lastY: e.clientY, pendingIdx: -1 };
          pointers.set(e.pointerId, st);
          try { canvas.setPointerCapture(e.pointerId); } catch (_) {}

          const i = indexAt(e.clientX, e.clientY);
          if (i >= 0) {
            st.touched.add(i);
            if (kind[i] === 1) clearTapped(i);
            else { makeTapped(i); st.pendingIdx = i; }
          }
        }

        function trackGesture(e) {
          const st = pointers.get(e.pointerId);
          if (!st) {
            if (e.pointerType === 'mouse') {
              const hand = overCircle(btn, e.clientX, e.clientY) || overCircle(rec, e.clientX, e.clientY) ||
                overCircle(cbtn, e.clientX, e.clientY) || swatchAt(e.clientX, e.clientY) >= 0 || barAt(e.clientX, e.clientY) >= 0;
              canvas.style.cursor = hand ? 'pointer' : 'default';
            }
            return;
          }
          const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
          for (const ev of (list.length ? list : [e])) {
            touchAlong(st, st.lastX, st.lastY, ev.clientX, ev.clientY);
            st.lastX = ev.clientX; st.lastY = ev.clientY;
          }
        }

        function endGesture(e) {
          if (!pointers.delete(e.pointerId)) return;     // only this pointer ends; others carry on. A pending tap simply stays.
          try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
        }

        canvas.addEventListener('pointerdown', startGesture);
        canvas.addEventListener('pointermove', trackGesture);
        canvas.addEventListener('pointerup', endGesture);
        canvas.addEventListener('pointercancel', endGesture);
        canvas.addEventListener('lostpointercapture', endGesture);
        canvas.addEventListener('dragstart', e => e.preventDefault());
        canvas.addEventListener('selectstart', e => e.preventDefault());
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        canvas.addEventListener('gesturestart', e => e.preventDefault());   // Safari pinch

        /* =====================================================================
           RESIZE
           ===================================================================== */
        let resizeQueued = false;
        function handleResize() {
          if (resizeQueued) return;
          resizeQueued = true;
          requestAnimationFrame(() => {
            resizeQueued = false;
            const L = computeLayout();
            if (L.w === W && L.h === H && L.cell === cell && L.cols === cols && L.rows === rows) return;
            applyLayout(L);
          });
        }
        window.addEventListener('resize', handleResize);

        applyLayout(computeLayout());
      })();
    </script>
  </body>
</html>
